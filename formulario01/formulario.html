<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Formulário de Cadastro</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<form action="/pagina-processa-dados-do-form" method="post">
    <h1 class="form-title">Cadastro</h1>
    <p class="form-subtitle">Preencha os dados abaixo com atenção.</p>

    <fieldset>
        <legend>Dados Gerais</legend>
        <label for="nome">Nome</label>
        <input type="text" name="nome" minlength="3" id="nome" />

        <div class="row">
          <div>
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" name="data_nascimento" id="data_nascimento" />
          </div>
          <div>
            <label for="cpf">CPF</label>
            <input type="text" name="cpf" minlength="11" maxlength="11" id="cpf" />
          </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Endereço</legend>

        <label for="tipo_endereco">Tipo</label>
        <select name="tipo_endereco" id="tipo_endereco">
            <option value="">Selecione</option>
            <option value="rua">Rua</option>
            <option value="estrada">Estrada</option>
            <option value="rodovia">Rodovia</option>
            <option value="outros">Outros</option>
        </select>

        <label for="logradouro_endereco">Logradouro</label>
        <input type="text" name="logradouro_endereco" id="logradouro_endereco" />

        <div class="row">
          <div>
            <label for="numero_endereco">Número</label>
            <input type="text" name="numero_endereco" id="numero_endereco" />
          </div>
          <div>
            <label for="complemento_endereco">Complemento</label>
            <input type="text" name="complemento_endereco" id="complemento_endereco" />
          </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Fale Conosco</legend>
        <label for="msg">Mensagem</label>
        <textarea name="msg" id="msg"></textarea>
    </fieldset>

    <fieldset>
        <button type="submit">Enviar sua mensagem</button>
        <button type="reset">Limpar o Formulário</button>
    </fieldset>
</form>

</body>
</html>
